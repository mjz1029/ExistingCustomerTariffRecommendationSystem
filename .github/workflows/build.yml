name: Build Release

on:
  push:
    tags:
      - 'v*'        # 推送 v 开头的 tag 时触发
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write    # 允许创建 Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            artifact: 套餐推荐系统-linux.bin
          - os: windows-latest
            name: Windows
            artifact: 套餐推荐系统-windows.exe
          - os: macos-latest
            name: macOS
            artifact: 套餐推荐系统-macos.app

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      # ── 前端构建 ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ── 后端打包 ──
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r backend/requirements.txt

      - name: Build with PyInstaller (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller \
            --noconfirm \
            --onefile \
            --name "套餐推荐系统" \
            --add-data "frontend/dist:frontend_dist" \
            --add-data "backend/app:backend/app" \
            --collect-all fastapi \
            --collect-all uvicorn \
            --collect-all sqlalchemy \
            --collect-all pydantic \
            --collect-all httpx \
            --collect-all openpyxl \
            --hidden-import multipart \
            --hidden-import multipart.multipart \
            --hidden-import email.mime.text \
            --hidden-import uvloop \
            --exclude-module tkinter \
            --exclude-module matplotlib \
            --exclude-module numpy \
            --exclude-module pandas \
            --console \
            run.py

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --name "套餐推荐系统" `
            --add-data "frontend/dist;frontend_dist" `
            --add-data "backend/app;backend/app" `
            --collect-all fastapi `
            --collect-all uvicorn `
            --collect-all sqlalchemy `
            --collect-all pydantic `
            --collect-all httpx `
            --collect-all openpyxl `
            --hidden-import multipart `
            --hidden-import multipart.multipart `
            --hidden-import email.mime.text `
            --exclude-module tkinter `
            --exclude-module matplotlib `
            --exclude-module numpy `
            --exclude-module pandas `
            --console `
            run.py
        shell: pwsh

      # ── 上传产物 ──
      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: ren "dist\套餐推荐系统.exe" "套餐推荐系统-windows.exe"
        shell: cmd

      - name: Rename artifact (Linux)
        if: runner.os == 'Linux'
        run: mv dist/套餐推荐系统 dist/套餐推荐系统-linux.bin

      - name: Package macOS .app bundle
        if: runner.os == 'macOS'
        run: |
          APP_DIR="dist/套餐推荐系统-macos.app/Contents/MacOS"
          mkdir -p "$APP_DIR"
          mv dist/套餐推荐系统 "$APP_DIR/套餐推荐系统"
          cat > dist/套餐推荐系统-macos.app/Contents/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>套餐推荐系统</string>
              <key>CFBundleName</key>
              <string>套餐推荐系统</string>
              <key>CFBundleIdentifier</key>
              <string>com.mobile.tariff-recommendation</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
          </dict>
          </plist>
          PLIST

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  # ── 汇总 Release ──
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/套餐推荐系统-linux.bin/*
            artifacts/套餐推荐系统-windows.exe/*
            artifacts/套餐推荐系统-macos.app/*
          generate_release_notes: true
